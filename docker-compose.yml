services:
  breath-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: breath-tracker:latest
    container_name: breath-tracker
    ports:
      - "5005:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
